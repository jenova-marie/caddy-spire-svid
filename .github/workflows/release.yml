name: 🎉 Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.24.2'

jobs:
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: 🏗️ Build release artifacts
      run: make release

    - name: 📝 Generate changelog
      id: changelog
      run: |
        # Simple changelog generation
        if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          git log --pretty=format:"* %s" $PREV_TAG..HEAD >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "CHANGELOG=Initial release 🎉" >> $GITHUB_OUTPUT
        fi

    - name: 🎊 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body: |
          🌸 **Caddy SPIRE Client Release ${{ github.ref_name }}**
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## 📦 Installation
          
          Download the appropriate binary for your platform from the assets below.
          
          ### Linux/macOS
          ```bash
          # Download and install (replace with your platform)
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/caddy-spire-svid-linux-amd64.tar.gz | tar xz
          sudo mv caddy-spire-svid /usr/local/bin/
          ```
          
          ### Windows
          Download the `.zip` file and extract to your desired location.
          
          ## 🔧 Usage
          ```bash
          caddy-spire-svid -help
          ```
          
          💖 Made with love by Jenova
        files: |
          dist/archives/*
        draft: false
        prerelease: false

  docker-caddy:
    name: 🐳 Caddy + SPIRE Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/amd64,linux/arm64,linux/arm/v7

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: 📝 Extract metadata for Caddy + SPIRE
      id: meta-caddy
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest
          type=raw,value=caddy-latest

    - name: 🏗️ Build and push Caddy + SPIRE Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.caddy
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: ${{ steps.meta-caddy.outputs.tags }}
        labels: ${{ steps.meta-caddy.outputs.labels }}
        cache-from: type=gha,scope=caddy-multiarch
        cache-to: type=gha,mode=max,scope=caddy-multiarch
        build-args: |
          BUILDKIT_PROGRESS=plain


    - name: 🎉 Docker Release Summary
      run: |
        echo "🌸 Caddy + SPIRE Docker image published successfully!"
        echo "🌐 Image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
        echo "💖 Multi-architecture (AMD64 + ARM64 + ARMv7) ready for your SPIRE-enabled Caddy deployment!"