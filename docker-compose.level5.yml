# 🐳 Level 5: Containerized Comprehensive Caddy + SPIRE Integration
# Tests containerized Caddy with SPIRE integration connecting to local spire-agent

services:
  # Containerized Caddy with SPIRE Module using default network
  caddy-spire-svid-test:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      cache_from:
        - caddy-spire-svid:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: caddy-spire-svid-test
    hostname: caddy-spire-svid-test
    # Use default Docker network and expose ports to host
    ports:
      - "9080:8080"    # HTTP (mapped to avoid conflicts)
      - "9443:8443"    # HTTPS with SPIRE (mapped to avoid conflicts)
      - "9444:9443"    # Layer 4 TLS proxy (mapped to avoid conflicts)
      - "9019:2020"    # Admin API (mapped to avoid conflicts)
    environment:
      - SPIRE_SOCKET_PATH=/tmp/spire-agent/public/api.sock
      - CADDY_ADMIN=0.0.0.0:2020
      - SPIRE_CERT_FILE=/tmp/spire-certs/cert.pem
      - SPIRE_KEY_FILE=/tmp/spire-certs/key.pem
    volumes:
      # Mount the SPIRE socket directory
      - /tmp/spire-agent/public:/tmp/spire-agent/public:ro
      # Use test SPIRE integration Caddyfile
      - ./test/docker/test.caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# 💖 Usage:
# docker-compose -f docker-compose.level5.yml up --build
#
# This tests:
# 1. Container builds successfully with SPIRE module
# 2. Container mounts local spire-agent socket
# 3. Container gets SPIRE certificates from local agent
# 4. Full HTTPS functionality with RecoverySky.org CA certificates
# 5. Container workload attestation with spire-agent
# 6. Same comprehensive testing as Level 3, but containerized
#
# Test with:
# make test-level5
# ./bin/level5_caddy_container_integration
