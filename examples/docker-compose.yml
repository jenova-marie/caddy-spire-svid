# 🌸 Caddy SPIRE Docker Compose
# Simple Caddy server with SPIRE integration
# Assumes SPIRE agent is already running on the host

version: '3.8'

services:
  # Caddy with SPIRE module
  caddy-spire:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: caddy-spire
    container_name: caddy-spire
    volumes:
      # 🔑 KEY: Mount host SPIRE agent socket (assumes SPIRE agent running on host)
      - /tmp/spire-agent/public/api.sock:/tmp/spire-agent/public/api.sock:ro
      # Configuration files
      - ./01-basic.caddyfile:/etc/caddy/Caddyfile:ro
      # Web content
      - ./html:/srv:ro
      # Logs and data
      - caddy-logs:/var/log/caddy
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8443:8443"
      - "2019:2019"  # Admin API
    environment:
      - CADDY_DEBUG=1
      # File-based certificate management for Layer 4 integration (optional)
      - SPIRE_CERT_FILE=/tmp/spire-certs/cert.pem
      - SPIRE_KEY_FILE=/tmp/spire-certs/key.pem
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Named volumes
volumes:
  caddy-logs:
    driver: local
  caddy-data:
    driver: local
