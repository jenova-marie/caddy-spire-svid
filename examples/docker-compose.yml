# 🌸 Docker Compose Example for SPIRE + Caddy Integration
version: '3.8'

services:
  # SPIRE Server
  spire-server:
    image: spiffe/spire-server:1.8.0
    hostname: spire-server
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-data:/opt/spire/data/server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    ports:
      - "8081:8081"
    networks:
      - spire

  # SPIRE Agent
  spire-agent:
    image: spiffe/spire-agent:1.8.0
    hostname: spire-agent
    depends_on:
      - spire-server
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - spire-socket:/tmp/spire-agent/public
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    networks:
      - spire

  # Caddy with SPIRE Client
  caddy-spire:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - spire-agent
    volumes:
      - spire-socket:/tmp/spire-agent/public:ro
      - ./examples/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    networks:
      - spire
      - web
    environment:
      - SPIRE_SOCKET_PATH=/tmp/spire-agent/public/api.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Example web application
  web-app:
    image: nginx:alpine
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/web:/usr/share/nginx/html:ro
    networks:
      - web
    ports:
      - "8080:80"

volumes:
  spire-data:
  spire-socket:

networks:
  spire:
    driver: bridge
  web:
    driver: bridge
