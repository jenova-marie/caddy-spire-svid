# 🌸 Docker Compose for Helper Tools Integration
version: '3.8'

services:
  # SPIRE Server
  spire-server:
    image: spiffe/spire-server:1.8.0
    hostname: spire-server
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-data:/opt/spire/data/server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    ports:
      - "8081:8081"
    networks:
      - spire

  # SPIRE Agent
  spire-agent:
    image: spiffe/spire-agent:1.8.0
    hostname: spire-agent
    depends_on:
      - spire-server
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - spire-socket:/tmp/spire-agent/public
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    networks:
      - spire

  # SPIRE Helper Tool
  spire-helper:
    build:
      context: ../..
      dockerfile: examples/helper-tools/Dockerfile
    depends_on:
      - spire-agent
    volumes:
      - spire-socket:/tmp/spire-agent/public:ro
      - cert-storage:/etc/ssl/spire
    command: [
      "-daemon",
      "-verbose", 
      "-cert-dir", "/etc/ssl/spire",
      "-socket", "/tmp/spire-agent/public/api.sock",
      "-interval", "30s"
    ]
    networks:
      - spire
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/ssl/spire/cert.pem"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Standard Caddy using helper-generated certificates
  caddy:
    image: caddy:2.7-alpine
    depends_on:
      - spire-helper
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cert-storage:/etc/ssl/spire:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - spire
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Example backend application
  backend:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      - web
    restart: unless-stopped

volumes:
  spire-data:
  spire-socket:
  cert-storage:

networks:
  spire:
    driver: bridge
  web:
    driver: bridge
