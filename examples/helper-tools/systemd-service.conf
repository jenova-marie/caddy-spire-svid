# 🌸 Systemd service file for SPIRE Helper Tool
# Place this file at: /etc/systemd/system/spire-helper.service

[Unit]
Description=SPIRE Helper Tool - File-based Certificate Management
Documentation=https://github.com/jenova-marie/caddy-spire-svid
After=network.target spire-agent.service
Requires=spire-agent.service
PartOf=spire-agent.service

[Service]
Type=simple
User=spire-helper
Group=spire-helper
Restart=always
RestartSec=10s
TimeoutStopSec=30s

# Environment
Environment=SPIRE_SOCKET_PATH=/run/spire/sockets/agent.sock

# Security settings
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/etc/ssl/spire /var/log/spire-helper

# Working directory
WorkingDirectory=/usr/local/bin

# Command
ExecStart=/usr/local/bin/spire-helper-wrapper \
    -daemon \
    -verbose \
    -cert-dir /etc/ssl/spire \
    -socket ${SPIRE_SOCKET_PATH} \
    -interval 30s

# Reload certificates on SIGHUP
ExecReload=/bin/kill -HUP $MAINPID

# Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=spire-helper

[Install]
WantedBy=multi-user.target
