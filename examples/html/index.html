<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Caddy SPIRE Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        .status { background: rgba(0, 255, 0, 0.2); padding: 1rem; border-radius: 10px; margin: 1rem 0; }
        .endpoints { background: rgba(255, 255, 255, 0.1); padding: 1rem; border-radius: 10px; margin-top: 2rem; }
        a { color: #ffd700; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Caddy SPIRE Demo</h1>
        
        <div class="status">
            <h2>✅ SPIFFE-Secured Connection</h2>
            <p>Your connection is secured with SPIRE certificates!</p>
        </div>
        
        <div class="endpoints">
            <h3>🌐 Available Endpoints</h3>
            <ul style="list-style: none; padding: 0;">
                <li><a href="http://localhost:8080">http://localhost:8080</a> - HTTP (no SPIRE)</li>
                <li><a href="https://localhost:8443">https://localhost:8443</a> - HTTPS with SPIRE</li>
                <li><a href="http://localhost:2019/config">http://localhost:2019/config</a> - Admin API</li>
            </ul>
        </div>
        
        <p><em>Powered by Caddy + SPIRE ✨</em></p>
    </div>
</body>
</html>
