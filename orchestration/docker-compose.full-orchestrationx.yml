# SIMPLE SPIRE AGENT + DIAGNOSTIC TEST
# ONLY tests containerized spire-agent + diagnostic attestation
# NO CADDY, NO COMPLEXITY, JUST BASIC SPIRE TESTING

services:
  # SPIRE Server (Local for testing)
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.4
    container_name: spire-server
    hostname: spire-server
    
    volumes:
      - spire-server-data:/opt/spire/data/server
      - ./server-volume/conf/server:/opt/spire/conf/server
    
    environment:
      - SPIRE_LOG_LEVEL=DEBUG
    
    networks:
      - spire-network
    
    ports:
      - "54345:54345"  # SPIRE server gRPC port
      - "8081:8081"    # SPIRE server bundle endpoint
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
      
  # SPIRE Agent Container
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.4
    container_name: spire-agent
    hostname: spire-agent
    
    volumes:
      # Mount the entire agent directory for configuration and data
      - ./agent-volume/conf/agent:/opt/spire/conf/agent
      - spire-socket:/tmp/spire-agent
    
    environment:
      - SPIRE_LOG_LEVEL=DEBUG
    
    networks:
      - spire-network
    
    # Agent needs server to be healthy first
    depends_on:
      spire-server:
        condition: service_healthy
    
    restart: unless-stopped
    
    # Override default command to use our config
    # command: ["spire-agent", "run", "-config", "/opt/spire/conf/agent.conf"]
    
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/tmp/spire-agent/public/api.sock"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # SPIRE Diagnostic Tool ONLY
  spire-diagnostic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spire-diagnostic
    hostname: spire-diagnostic
    
    volumes:
      # Use the shared volume for SPIRE socket
      - spire-socket:/tmp/spire-agent:ro
    
    environment:
      - SPIRE_SOCKET_PATH=unix:///tmp/spire-agent/public/api.sock
      # Add debug logging
      - DEBUG=1
    
    networks:
      - spire-network
    
    depends_on:
      spire-agent:
        condition: service_healthy
    
    # Run once and exit (don't restart on failure)
    restart: "no"

  # Workload Registration Service
  spire-workload-registrar:
    image: alpine:latest
    container_name: spire-workload-registrar
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./register-workloads.sh:/register-workloads.sh:ro
    
    networks:
      - spire-network
    
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
    
    # Install docker CLI and jq, then run registration script
    command: |
      sh -c "
        apk add --no-cache docker-cli jq &&
        chmod +x /register-workloads.sh &&
        /register-workloads.sh &&
        echo '✅ Workload registration complete!'
      "
    
    restart: "no"

# Networks
networks:
  spire-network:
    driver: bridge

# Volumes  
volumes:
  spire-socket:
    driver: local
  spire-agent-data:
    driver: local
  spire-server-data:
    driver: local
